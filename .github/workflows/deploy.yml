name: Deploy NestJS Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  

      - name: Validate SSH Key Format
        run: |
          # Check key length and basic format without exposing content
          KEY_LEN=$(echo -n "${{ secrets.VPS_SSH_KEY }}" | wc -l)
          echo "Key has $KEY_LEN lines"
    
          if [[ "${{ secrets.VPS_SSH_KEY }}" == *"BEGIN"* ]] && [[ "${{ secrets.VPS_SSH_KEY }}" == *"END"* ]]; then
            echo "✓ SSH key format looks correct"
          else
          echo "✗ SSH key missing BEGIN/END markers"
          exit 1
          fi
        shell: bash

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd /srv/mwz3-server
            git pull origin main
            npm install
            npm run build
            pm2 restart mwz3server